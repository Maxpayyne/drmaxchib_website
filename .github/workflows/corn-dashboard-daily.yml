name: corn-dashboard-daily

# Runs the Python pipeline each morning, then commits any updated JSON
# under src/data/corn-dashboard/. Your Cloudflare Pages → GitHub
# integration sees the commit and triggers a rebuild, which picks up the
# new JSON via Vite's import.meta.glob in corn-dashboard.astro.
#
# If you do NOT have Pages auto-build on push (i.e. you publish via
# `wrangler deploy` from your laptop), the commit step still works — you
# just deploy when you're ready. Or add a build+wrangler step at the
# bottom and a CLOUDFLARE_API_TOKEN secret.

on:
  schedule:
    # 11:00 UTC = 6 AM Central — after overnight ERA5 finalization at Open-Meteo
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      planting_date:
        description: 'Planting date for current-year run (YYYY-MM-DD)'
        required: false
        type: string
      years:
        description: 'Years to refresh, space-separated (default: current year only)'
        required: false
        type: string
      sites:
        description: 'Sites to refresh, space-separated (default: pds arl msh)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/corndash/pyproject.toml

      - name: Install pipeline
        working-directory: tools/corndash
        run: pip install -e .

      - name: Run pipeline
        working-directory: tools/corndash
        run: |
          set -e
          ARGS=""
          if [ -n "${{ inputs.years }}" ]; then
            ARGS="$ARGS --years ${{ inputs.years }}"
          else
            ARGS="$ARGS --current"
          fi
          if [ -n "${{ inputs.planting_date }}" ]; then
            ARGS="$ARGS --planting ${{ inputs.planting_date }}"
          fi
          if [ -n "${{ inputs.sites }}" ]; then
            ARGS="$ARGS --sites ${{ inputs.sites }}"
          fi
          mkdir -p ../../src/data/corn-dashboard
          python -m corndash.pipeline $ARGS --out ../../src/data/corn-dashboard

      - name: Commit refreshed data
        run: |
          git config user.name "corn-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/corn-dashboard
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "data: corn-dashboard refresh $(date -u +%F)"
            git push
          fi
