[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corndash"
version = "0.1.0"
description = "Corn disease risk dashboard pipeline for US Dairy Forage Research Center"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maxwell Chibuogwu" }]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "python-dateutil>=2.8",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
